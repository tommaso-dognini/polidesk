# Builds installers for macOS, Windows and Linux (each on its own OS, so the bundled
# ffmpeg binary and the Rust backend match the platform; macOS gets universal binaries).
# Artifacts are attached to the workflow run and, for a tag (or a manual run with a tag), uploaded to that GitHub release.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release a cui caricare gli installer (es. v0.1.0); vuoto = solo artifact'
        required: false
        default: ''
permissions:
  contents: write   # upload to the release
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: dist/*.dmg dist/*.dmg.blockmap dist/*.zip dist/*.zip.blockmap dist/latest-mac.yml
          - os: windows-latest
            target: --win
            files: dist/*.exe dist/*.exe.blockmap dist/latest.yml
          - os: ubuntu-latest
            target: --linux
            files: dist/*.AppImage dist/*.deb dist/latest-linux.yml
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build:editor
      - run: node scripts/build-rust.js
      # never published by electron-builder: the files are uploaded below, to an existing release too
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: polidesk-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
      - name: Upload to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "PoliDesk ${TAG#v}" --notes "Installer di PoliDesk ${TAG#v}."
          gh release upload "$TAG" ${{ matrix.files }} --clobber
