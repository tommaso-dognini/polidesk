[package]
name = "polidesk-core"
description = "PoliDesk: logica del backend (configurazione, corsi, appunti, AI, trascrizione, sincronizzazione)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
chromiumoxide = { version = "0.9", default-features = false }
libc = "0.2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
gethostname = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
futures-util = "0.3"
trash = "5"
fancy-regex = "0.14"
base64 = "0.22"
flate2 = "1"
sha1 = "0.10"
