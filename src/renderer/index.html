<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' media: file:; font-src 'self'">
    <title>PoliRec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="drag"></div>
            <div class="brand"><span class="logo">●</span><span>PoliRec</span></div>
            <nav class="nav">
                <a data-route="dashboard" class="nav-item"><span class="ico">⌂</span>Dashboard</a>
                <a data-route="community" class="nav-item"><span class="ico">✦</span>Community</a>
                <a data-route="settings" class="nav-item"><span class="ico">⚙</span>Impostazioni</a>
            </nav>
            <div class="nav-label">Corsi</div>
            <nav id="side-courses" class="nav courses"></nav>
            <div id="side-status" class="side-status"></div>
        </aside>
        <main id="main">
            <div class="drag top"></div>
            <div id="banner" class="banner hidden"></div>
            <div id="view"></div>
            <footer id="activity" class="activity">
                <button id="act-toggle" class="activity-head">
                    <span id="act-dot" class="dot idle"></span><span id="act-text">Pronto</span><span class="grow"></span><span class="chev">⌃</span>
                </button>
                <pre id="log"></pre>
            </footer>
        </main>
    </div>
    <div id="modal-root"></div>
    <div id="menu" class="menu hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script src="app.js"></script>
</body>
</html>
