<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: file: media:; media-src 'self' media: file: blob:; font-src 'self' data:; frame-src 'self' file:">
    <title>PoliRec</title>
    <link rel="stylesheet" href="vendor/katex.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar">
            <div class="drag"></div>
            <div class="brand"><span class="logo">●</span><span>PoliRec</span><span class="grow"></span><button class="icon ghost small sb-btn" id="sb-hide" title="Nascondi barra laterale (⌘\)">⇤</button></div>
            <nav class="nav">
                <a data-route="dashboard" class="nav-item"><span class="ico">⌂</span>Dashboard</a>
                <a data-route="notes" class="nav-item"><span class="ico">✎</span>Appunti</a>
                <a data-route="calendar" class="nav-item"><span class="ico">▦</span>Calendario</a>
                <a data-route="rooms" class="nav-item"><span class="ico">⌖</span>Aule libere</a>
                <a data-route="todos" class="nav-item"><span class="ico">☑</span>Da fare</a>
            </nav>
            <div class="nav-label">Corsi</div>
            <nav id="side-courses" class="nav courses"></nav>
            <div id="pomo" class="pomo"></div>
            <nav class="nav">
                <a data-route="community" class="nav-item"><span class="ico">✦</span>Community</a>
                <a data-route="settings" class="nav-item"><span class="ico">⚙</span>Impostazioni</a>
            </nav>
            <div id="side-status" class="side-status"></div>
        </aside>
        <div id="sb-hot" title=""></div>
        <main id="main">
            <button class="icon ghost small sb-btn" id="sb-show" title="Mostra barra laterale (⌘\)">☰</button>
            <div class="drag top"></div>
            <div id="banner" class="banner hidden"></div>
            <div id="view"></div>
            <footer id="activity" class="activity">
                <button id="act-toggle" class="activity-head">
                    <span id="act-dot" class="dot idle"></span><span id="act-text">Pronto</span><span class="grow"></span><span class="chev">⌃</span>
                </button>
                <pre id="log"></pre>
            </footer>
        </main>
    </div>
    <div id="modal-root"></div>
    <div id="menu" class="menu hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script src="vendor/editor.js"></script>
    <script src="app.js"></script>
    <script src="views.js"></script>
</body>
</html>
