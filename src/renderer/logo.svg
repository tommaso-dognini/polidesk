<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PoliDesk: the lesson on screen (play + notes) and a pencil to write them. Flat, black and white, thick outlines. -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="#fafafa"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#111" stroke-opacity=".12" stroke-width="4"/>
  <g stroke="#111" stroke-width="28" stroke-linejoin="round" stroke-linecap="round">
    <!-- stand -->
    <path d="M500 640 V736 M410 742 H590" fill="none" stroke-width="32"/>
    <!-- the lesson screen -->
    <g transform="rotate(-4 500 470)">
      <rect x="226" y="276" width="548" height="378" rx="30" fill="#f1ede4"/>
      <!-- play -->
      <path d="M300 396 L414 462 L300 528 Z" fill="#111"/>
      <!-- notes -->
      <path d="M478 386 H684 M478 446 H648 M478 506 H684 M300 584 H580" fill="none" stroke-width="30"/>
    </g>
    <!-- pencil -->
    <g transform="rotate(40 700 640)">
      <rect x="660" y="430" width="80" height="300" rx="8" fill="#f1ede4"/>
      <rect x="660" y="430" width="80" height="62" rx="8" fill="#111"/>
      <path d="M660 730 L700 816 L740 730 Z" fill="#f1ede4"/>
      <path d="M686 786 L700 816 L714 786 Z" fill="#111"/>
    </g>
  </g>
</svg>
